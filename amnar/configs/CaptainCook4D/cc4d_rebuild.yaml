# CaptainCook4D, all recipes in one model (task 0), 1 fps features (DINOv2-S by default; run_cc4d.sh swaps in
# Omnivore / SlowFast). Same settings as AMNAR's EgoPER DINOv2 configs except dataset, input_dim, fps, no object graph.
dataset_name: CaptainCook4D
train_split: train
val_split: null
test_split: test
model_name: LocPointTransformer_CSPL_GCN
dataset: {
  num_classes: 351,
  trunc_thresh: 0.5,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 2304,
  background_ratio: 1.0,
  use_gcn: False,
  task: '0',
  default_fps: 1,
  features_subdir: dinov2_s
}
model: {
  fpn_type: identity,
  backbone_type: convGCNTransformer,
  max_buffer_len_factor: 6.0,
  n_mha_win_size: 19,
  input_dim: 768,
  online_mode: True
}
rebuild_model_cfg: {
  num_layers : 1,
  use_multiple_possibilities: single_intersection_gt_label,
  results_frame_type: pred,
  return_transformed: False,
  diversity_mode: cluster_center,
  diversity_max_added_seq: 5,
  use_norm: True,
  freeze_backbone: False,
  win_len: 32,
  dilation: 3,
  dilated_conv_layers: 5,
  conv_non_linear: False,
  potential_action_generation_filtration_rate: 5,
  cluster_update_interval: 10,
  cluster_update_stop_epoch: 0.40,
  cluster_center_update_momentum: 0.9,
  action_feat_to_center_distance_loss_dist: -1,
  concat_query_to_attnout: False,
  use_layernorm: False,
  drop_rate: 0.1,
  intersection_threshold: 0.6
}
opt: {
  learning_rate: 0.001,
  epochs: 60,
  weight_decay: 0.05,
  schedule_gamma: 0.7,
}
loader: {
  batch_size: 2,
  num_workers: 0,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  model_mode: rebuild,
  rebuild_loss_weight: 2.0,
  rebuild_loss_choice: residual,
  rebuild_model_choice: cross_attn,
}
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 2000,
  max_seg_num: 200,
  min_score: 0.001,
  multiclass_nms: True,
}
error_detection_inference_cfg: {
  quantile: 0.85,
}
output_folder: ./ckpt/CaptainCook4D/
